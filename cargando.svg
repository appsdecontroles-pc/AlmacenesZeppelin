<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 256" width="200" height="256" role="img" aria-label="Cargando">
  <style>
    .arco { transform-box: view-box; transform-origin: 100px 96px; animation: girar 1.6s linear infinite; }
    .nave { transform-box: view-box; transform-origin: 100px 100px; animation: flotar 2.4s ease-in-out infinite; }
    .estela line { animation: estela 1.2s ease-in-out infinite; }
    .estela line:nth-child(2) { animation-delay: .2s; }
    .estela line:nth-child(3) { animation-delay: .4s; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @keyframes flotar {
      0%, 100% { transform: translateY(-4px) rotate(-3deg); }
      50% { transform: translateY(4px) rotate(2deg); }
    }
    @keyframes estela {
      0%, 100% { opacity: 0; transform: translateX(6px); }
      50% { opacity: 1; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arco, .nave, .estela line { animation-duration: 6s; }
    }
  </style>

  <!-- Arco del logo, girando -->
  <circle class="arco" cx="100" cy="96" r="74" fill="none" stroke="#E0DE27" stroke-width="13"
          stroke-linecap="round" stroke-dasharray="250 215"/>

  <g class="nave">
    <!-- Estela -->
    <g class="estela" stroke="#0172B6" stroke-width="3" stroke-linecap="round" opacity=".6">
      <line x1="10" y1="88" x2="22" y2="88"/>
      <line x1="6" y1="99" x2="20" y2="99"/>
      <line x1="10" y1="110" x2="22" y2="110"/>
    </g>
    <!-- Aletas -->
    <path d="M60 84 L30 66 Q27 64 29 68 L42 92 Z" fill="#0172B6"/>
    <path d="M60 108 L32 126 Q29 128 30 124 L42 100 Z" fill="#0172B6"/>
    <!-- Cuerpo -->
    <path d="M42 96 C42 80 72 68 108 68 C140 68 160 80 160 96 C160 112 140 124 108 124 C72 124 42 112 42 96 Z" fill="#0172B6"/>
    <!-- Franjas blancas -->
    <path d="M52 92 C78 78 116 74 152 86" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 103 C80 96 118 94 154 103" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <!-- Nariz -->
    <path d="M148 80 Q162 88 160 100" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- Góndola -->
    <path d="M92 122 L96 130 L120 130 L124 122" fill="#fff" stroke="#0172B6" stroke-width="4" stroke-linejoin="round"/>
  </g>

